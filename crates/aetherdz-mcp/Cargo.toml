[package]
name = "aetherdz-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aetherdz MCP server: exposes session/recall/sync tools over stdio + HTTP/SSE"

[dependencies]
aetherdz-core = { path = "../aetherdz-core" }
aetherdz-session = { path = "../aetherdz-session" }
aetherdz-sync = { path = "../aetherdz-sync" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rmcp = { version = "3.1.2", features = [
    "server", "schemars", "transport-io", "transport-streamable-http-server", "tower"
] }
rmcp-macros = "3.1.2"
schemars = "0.8"
tower = "0.5"
http = "1"
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
