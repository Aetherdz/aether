[workspace]
resolver = "2"
members = [
    "crates/aetherdz-core",
    "crates/aetherdz-provider",
    "crates/aetherdz-session",
    "crates/aetherdz-sync",
    "crates/aetherdz-mcp",
    "crates/aetherdz-cli",
    "crates/aetherdz-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Aetherdz"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rustyline = "15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
