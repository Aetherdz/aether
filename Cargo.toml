[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-provider",
    "crates/aether-agent",
    "crates/aether-session",
    "crates/aether-sync",
    "crates/aether-mcp",
    "crates/aether-cli",
    "crates/aether-tui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Aetherdz"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rustyline = "15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = "0.29"
cap-std = "4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
