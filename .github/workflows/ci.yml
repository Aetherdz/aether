name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy (hard gate)
        run: cargo clippy -- -D warnings

      - name: Rustfmt
        run: cargo fmt -- --check

  golden:
    runs-on: ubuntu-latest
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Setup Node (TS oracle)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run golden differential vs TS reference
        run: |
          AETHER_BIN=target/release/aether bash golden-tests/run.sh